<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music Player</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="player">
  <div class="disc" id="disc"></div>

  <div class="info">
    <h2 id="title">Song title</h2>
    <p id="artist">Artist</p>
  </div>

  <div class="progress-area">
    <input type="range" id="progress" min="0" max="100" value="0" aria-label="Seek">
    <div class="times">
      <span id="currentTime">0:00</span>
      <span id="duration">0:00</span>
    </div>
  </div>

  <div class="controls">
    <button id="prev" aria-label="Previous song">&#9198;</button>
    <button id="play" class="play-btn" aria-label="Play">&#9654;</button>
    <button id="next" aria-label="Next song">&#9197;</button>
  </div>

  <div class="volume">
    <span id="volIcon">&#128266;</span>
    <input type="range" id="volume" min="0" max="1" step="0.01" value="0.7" aria-label="Volume">
  </div>

  <div class="options">
    <label class="autoplay">
      <input type="checkbox" id="autoplay" checked> Autoplay next song
    </label>
  </div>

  <ul class="playlist" id="playlist"></ul>
</div>

<audio id="audio" preload="metadata"></audio>
<script src="script.js"></script>
</body>
</html>
